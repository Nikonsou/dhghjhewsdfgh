name: Build Sintezator Gaeva

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target SintezatorGaeva_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Sintezator-Gaeva-VST3
          path: build/SintezatorGaeva_artefacts/Release/VST3/
